<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;font:14px system-ui;color:#334155}svg{display:block;width:100%;background:#eef2f6;border-radius:10px}
.region{cursor:pointer}.region:focus{outline:none}.region:focus polygon{stroke:#7c3aed;stroke-width:5}
.region:hover polygon{fill-opacity:.22}p{margin:8px 0;font-size:13px}
</style></head><body><svg id="photo" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="Detected handwriting. Select a numbered region."></svg>
<p>Click a box to inspect its handwriting. <span style="color:#b45309">Orange</span> marks your selection.</p>
<script>
const root=document.getElementById('photo'), ns='http://www.w3.org/2000/svg';let args;
function send(type,extra={}){parent.postMessage({isStreamlitMessage:true,type,...extra},'*')}
function el(tag,attrs={}){const e=document.createElementNS(ns,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);return e}
function resize(){if(args){root.style.height=Math.min(480,root.clientWidth*args.height/args.width)+'px';send('streamlit:setFrameHeight',{height:document.body.scrollHeight})}}
function render(a){args=a;root.replaceChildren();root.setAttribute('viewBox',`0 0 ${a.width} ${a.height}`);
root.appendChild(el('image',{href:a.image,width:a.width,height:a.height}));
const stroke=Math.max(2,a.width/250),font=Math.max(18,a.width/34);
a.lines.forEach((line,i)=>{
 const group=el('g',{class:'region',tabindex:0,role:'button','aria-label':`Region ${i+1}: ${line.text||'Unclear writing'}`,'aria-pressed':i===a.selected});
 const colour=i===a.selected?'#d97706':'#0d9488';
 group.appendChild(el('polygon',{points:line.box.map(p=>p.join(',')).join(' '),stroke:colour,'stroke-width':stroke,fill:colour,'fill-opacity':i===a.selected?.16:.04}));
 const x=Math.max(0,Math.min(...line.box.map(p=>p[0]))),y=Math.max(0,Math.min(...line.box.map(p=>p[1]))-font*1.3);
 group.appendChild(el('rect',{x,y,width:font*1.5,height:font*1.3,rx:font*.15,fill:colour}));
 const label=el('text',{x:x+font*.2,y:y+font,fill:'white','font-size':font,'font-family':'system-ui','font-weight':700});label.textContent=i+1;group.appendChild(label);
 const select=()=>send('streamlit:setComponentValue',{value:{index:i,event:Date.now()},dataType:'json'});
 group.addEventListener('click',select);group.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select()}});root.appendChild(group);
});resize()}
window.addEventListener('message',e=>{if(e.source===parent&&e.data.type==='streamlit:render')render(e.data.args)});
window.addEventListener('resize',resize);send('streamlit:componentReady',{apiVersion:1});send('streamlit:setFrameHeight',{height:300});
</script></body></html>
